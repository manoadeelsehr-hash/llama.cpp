name: Remote Android Vulkan Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential glslc libvulkan-dev spirv-headers unzip wget

      - name: Install Android NDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q commandlinetools-linux-13114758_latest.zip
          mv cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "ndk;29.0.13113456"

      - name: Configure Android Vulkan build
        env:
          ANDROID_NDK: /home/runner/android-sdk/ndk/29.0.13113456
        run: |
          export PATH="/home/runner/android-sdk/cmdline-tools/latest/bin:$PATH"
          export PATH="/usr/bin:$PATH"
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          command -v cmake
          command -v ninja
          test -d "$HOME/vulkan-install"
          test -d "$HOME/spirv-install"
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DGGML_VULKAN=ON -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DCMAKE_CXX_FLAGS="-I$HOME/vulkan-install/include" -DCMAKE_PREFIX_PATH="$HOME/spirv-install;$HOME/vulkan-install" -DSPIRV-Headers_DIR="$SPIRV_HEADERS_DIR" -DVulkanHeaders_DIR="$VULKAN_HEADERS_DIR"

      - name: Build
        run: |
          cmake --build build-android --parallel

      - name: Package
        run: |
          tar -czf llama-android-vulkan.tar.gz -C build-android/bin .

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: llama-android-vulkan
          path: llama-android-vulkan.tar.gz
